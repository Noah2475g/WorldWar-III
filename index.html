<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>WorldWar — Projektstand</title>
<meta name="description" content="Stand des Projekts WorldWar: Fachbereiche, Anleitung, Roadmap und Repo-Status.">
<style>
:root {
  color-scheme: dark;
  --bg: #121212;
  --surface: #1a1c20;
  --surface-raised: #202329;
  --border: #3a3f47;
  --border-strong: #5c6a78;
  --text: #e0e0e0;
  --text-muted: #a9aeb6;
  --accent: #e0a220;
  --accent-soft: rgba(224, 162, 32, 0.12);
  --on-accent: #1a1200;
  /* Statusfarben: Knoten, Tönung, Rahmen. */
  --status-fertig: #4caf50;
  --status-in-arbeit: #f0a500;
  --status-geplant: #888888;
  /* Statustext: #888 und #4caf50 schaffen auf ihrer 20-%-Tönung keine 4,5:1 — leicht aufgehellt (≥ 4,6:1 auf allen Flächen). */
  --status-fertig-text: #60b863;
  --status-in-arbeit-text: #f0a500;
  --status-geplant-text: #a1a1a1;
  --status-fertig-bg: rgba(76, 175, 80, 0.2);
  --status-in-arbeit-bg: rgba(240, 165, 0, 0.2);
  --status-geplant-bg: rgba(136, 136, 136, 0.2);
  --timeline-line: rgba(224, 162, 32, 0.5);
  --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  --font-mono: ui-monospace, "Cascadia Mono", "Segoe UI Mono", Consolas, "SF Mono", Menlo, monospace;
  --radius: 8px;
  --nav-height: 3.75rem;
  --ease: 240ms ease;
  --page-pad: 1.25rem;
  --max: 72rem;
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

@media (prefers-reduced-motion: no-preference) {
  html { scroll-behavior: smooth; }
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 1rem;
  line-height: 1.6;
}

h1, h2, h3 { line-height: 1.15; margin: 0; font-weight: 700; }
p { margin: 0; }
a { color: var(--accent); text-underline-offset: 0.2em; }
a:hover { text-decoration-thickness: 2px; }
code, kbd { font-family: var(--font-mono); font-size: 0.9em; }
code { background: var(--surface-raised); border: 1px solid var(--border); border-radius: 4px; padding: 0.05em 0.35em; }

:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 3px;
  border-radius: 4px;
}

.visually-hidden {
  position: absolute !important;
  width: 1px; height: 1px;
  margin: -1px; padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

.skip-link {
  position: absolute;
  left: 1rem; top: -10rem;
  z-index: 100;
  background: var(--accent);
  color: var(--on-accent);
  padding: 0.6rem 1rem;
  border-radius: var(--radius);
  font-weight: 700;
  text-decoration: none;
}
.skip-link:focus { top: 0.75rem; }

.wrap {
  width: 100%;
  max-width: var(--max);
  margin-inline: auto;
  padding-inline: var(--page-pad);
}

/* ── Navigation ─────────────────────────────── */
.site-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(18, 18, 18, 0.94);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(8px);
}
.nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  min-height: var(--nav-height);
}
.brand {
  display: inline-flex;
  align-items: baseline;
  gap: 0.6rem;
  color: var(--text);
  text-decoration: none;
  font-weight: 800;
  font-size: 1.125rem;
  letter-spacing: 0.01em;
}
.brand-version {
  font-family: var(--font-mono);
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-muted);
}
.nav-toggle {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 2.75rem; height: 2.75rem;
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  font-size: 1.35rem;
  line-height: 1;
  cursor: pointer;
}
.nav-toggle:hover { border-color: var(--accent); }
.nav-links {
  position: absolute;
  top: 100%; left: 0; right: 0;
  margin: 0;
  padding: 0.5rem var(--page-pad) 1rem;
  list-style: none;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}
.nav-links[data-open="false"] { display: none; }
.nav-links a {
  display: block;
  padding: 0.75rem 0.25rem;
  color: var(--text);
  text-decoration: none;
  border-left: 3px solid transparent;
  padding-left: 0.75rem;
}
.nav-links a:hover { color: var(--accent); }
.nav-links a[aria-current="true"] {
  color: var(--accent);
  border-left-color: var(--accent);
  font-weight: 600;
}

/* ── Abschnitte ─────────────────────────────── */
main > section { scroll-margin-top: calc(var(--nav-height) + 0.5rem); }
.section { padding-block: 4rem; border-top: 1px solid var(--border); }
.section-head { display: grid; gap: 0.75rem; margin-bottom: 2rem; max-width: 46rem; }
.eyebrow {
  font-family: var(--font-mono);
  font-size: 0.8125rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
}
.section h2 { font-size: clamp(1.75rem, 4vw, 2.5rem); }
.lead { color: var(--text-muted); font-size: 1.0625rem; }

/* ── Hero ───────────────────────────────────── */
.hero {
  padding-block: 3.5rem 4.5rem;
  background-image:
    linear-gradient(rgba(224, 224, 224, 0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(224, 224, 224, 0.035) 1px, transparent 1px);
  background-size: 48px 48px;
  background-position: -1px -1px;
}
.hero-grid { display: grid; gap: 3rem; align-items: center; }
.hero-text { display: grid; gap: 1.5rem; }
.hero h1 {
  font-size: clamp(3rem, 13vw, 6.5rem);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 0.95;
}
.hero-desc { font-size: 1.125rem; max-width: 38rem; }
.hero-desc + .hero-desc { color: var(--text-muted); }
.facts {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1px;
  margin: 0.5rem 0 0;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.fact { background: var(--bg); padding: 0.85rem 1rem; display: grid; gap: 0.15rem; }
.fact dt { font-size: 0.8125rem; color: var(--text-muted); }
.fact dd {
  margin: 0;
  font-family: var(--font-mono);
  font-size: 1.25rem;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.hero-figure { margin: 0; display: grid; gap: 0.75rem; }
.hero-figure img {
  display: block;
  width: 100%;
  height: auto;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1rem;
}
.hero-figure figcaption { font-size: 0.875rem; color: var(--text-muted); }

/* ── Status-Badges ──────────────────────────── */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 0.4em;
  padding: 0.15rem 0.6rem;
  border: 1px solid currentColor;
  border-radius: 999px;
  font-size: 0.8125rem;
  font-weight: 600;
  line-height: 1.5;
  white-space: nowrap;
}
.badge[data-status="fertig"] { color: var(--status-fertig-text); }
.badge[data-status="in-arbeit"] { color: var(--status-in-arbeit-text); }
.badge[data-status="geplant"] { color: var(--status-geplant-text); }

.status-summary {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem 1rem;
  margin: 0 0 1.5rem;
  padding: 0;
  list-style: none;
  color: var(--text-muted);
  font-size: 0.9375rem;
}

/* ── Fachbereiche ───────────────────────────── */
.card-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 1rem;
  margin: 0;
  padding: 0;
  list-style: none;
}
.card-grid > li { display: flex; }
.card {
  position: relative;
  flex: 1;
  display: grid;
  grid-template-rows: auto auto 1fr auto;
  gap: 0.75rem;
  padding: 1.25rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  transition: border-color var(--ease), background-color var(--ease), transform var(--ease);
}
.card:hover { border-color: var(--border-strong); transform: scale(1.01); }
.card[data-open="true"] {
  border-color: var(--accent);
  background: linear-gradient(var(--accent-soft), var(--accent-soft)), var(--surface);
}
/* Der Button sitzt im Titel; sein ::after spannt die Klickfläche über die ganze Karte. */
.card-button {
  padding: 0;
  font: inherit;
  color: inherit;
  text-align: left;
  background: none;
  border: 0;
  cursor: pointer;
}
.card-button::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: var(--radius);
}
.card-button:focus-visible { outline: none; }
.card-button:focus-visible::after { outline: 3px solid var(--accent); outline-offset: 3px; }
.muted { color: var(--text-muted); }
.commit-msg { display: block; font-size: 0.875rem; }
main:focus { outline: none; }
.card-top { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
.card-icon { font-size: 1.6rem; line-height: 1; }
.card h3 { font-size: 1.1875rem; }
.card-desc { color: var(--text-muted); font-size: 0.9375rem; }
.card-path { font-family: var(--font-mono); font-size: 0.8125rem; color: var(--text-muted); }

.detail {
  margin-top: 1.5rem;
  padding: 1.5rem 1.25rem;
  background: var(--surface-raised);
  border: 1px solid var(--border-strong);
  border-top: 3px solid var(--accent);
  border-radius: var(--radius);
  scroll-margin-top: calc(var(--nav-height) + 1rem);
}
@media (prefers-reduced-motion: no-preference) {
  .detail:not([hidden]) { animation: detail-in 260ms ease; }
}
@keyframes detail-in {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: none; }
}
.detail-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.25rem; }
.detail-title { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
.detail h3 { font-size: clamp(1.4rem, 3vw, 1.875rem); }
.detail h3:focus { outline: none; }
.detail h3:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
.detail h4 {
  margin: 0 0 0.6rem;
  font-size: 0.8125rem;
  font-family: var(--font-mono);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-muted);
  font-weight: 600;
}
.detail-body { display: grid; gap: 2rem; }
.detail-text { font-size: 1.0625rem; max-width: 46rem; }
.detail-cols { display: grid; gap: 2rem; }
.detail ul { margin: 0; padding-left: 1.2rem; display: grid; gap: 0.4rem; }
.detail li::marker { color: var(--accent); }
.kv { margin: 0; display: grid; gap: 0.5rem; }
.kv div { display: flex; justify-content: space-between; gap: 1rem; border-bottom: 1px dashed var(--border); padding-bottom: 0.4rem; }
.kv dt { color: var(--text-muted); }
.kv dd { margin: 0; font-family: var(--font-mono); text-align: right; font-variant-numeric: tabular-nums; }
.open-points li::marker { color: var(--status-geplant); }
.file-list { list-style: none; padding-left: 0 !important; }
.file-list a { font-family: var(--font-mono); font-size: 0.875rem; word-break: break-all; }
.file-list span { display: block; color: var(--text-muted); font-size: 0.875rem; }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  min-height: 2.75rem;
  padding: 0.5rem 1rem;
  font: inherit;
  font-weight: 600;
  color: var(--text);
  background: transparent;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  cursor: pointer;
  transition: border-color var(--ease), color var(--ease);
}
.btn:hover { border-color: var(--accent); color: var(--accent); }

/* ── Anleitung: Akkordeon ───────────────────── */
.accordion { display: grid; gap: 0.75rem; }
.acc-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  scroll-margin-top: calc(var(--nav-height) + 0.75rem);
  transition: border-color var(--ease);
}
.acc-item[data-open="true"] { border-color: var(--border-strong); }
.acc-heading { margin: 0; font-size: inherit; }
.acc-button {
  width: 100%;
  min-height: 3.5rem;
  display: flex;
  align-items: center;
  gap: 0.85rem;
  padding: 0.9rem 1.1rem;
  font: inherit;
  font-size: 1.125rem;
  font-weight: 700;
  color: var(--text);
  text-align: left;
  background: transparent;
  border: 0;
  border-radius: var(--radius);
  cursor: pointer;
  transition: color var(--ease);
}
.acc-button:hover,
.acc-button[aria-expanded="true"] { color: var(--accent); }
.acc-chevron { flex: none; width: 1.1rem; color: var(--accent); text-align: center; }
.acc-meta {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-muted);
  white-space: nowrap;
}
.acc-panel {
  position: relative;
  max-height: 0;
  overflow: hidden;
  visibility: hidden;
  transition: max-height 300ms ease, visibility 0s linear 300ms;
}
.acc-panel[data-open="true"] {
  visibility: visible;
  transition: max-height 300ms ease, visibility 0s linear 0s;
}
.acc-inner {
  display: grid;
  gap: 1.75rem;
  padding: 1.25rem 1.1rem 1.5rem;
  border-top: 1px solid var(--border);
}
.acc-intro { font-size: 1.0625rem; max-width: 46rem; }
.sub-label {
  margin: 0 0 0.75rem;
  font-family: var(--font-mono);
  font-size: 0.8125rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-muted);
}
.field-list { margin: 0; display: grid; gap: 0.75rem; }
.field-list div { display: grid; gap: 0.1rem; }
.field-list dt { font-weight: 600; }
.field-list dd { margin: 0; color: var(--text-muted); }
.tag-list { margin: 0.75rem 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 0.5rem; }
.tag-list li {
  padding: 0.15rem 0.7rem;
  font-size: 0.875rem;
  border: 1px solid var(--border-strong);
  border-radius: 999px;
}
.note-plain { color: var(--text-muted); font-size: 0.9375rem; }

/* position: relative, damit absolut positionierte Screenreader-Texte in der Tabelle mitgeclippt werden. */
.table-wrap { position: relative; overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); }
.controls { width: 100%; min-width: 44rem; border-collapse: collapse; font-size: 0.9375rem; }
.controls th, .controls td { padding: 0.65rem 0.85rem; text-align: left; vertical-align: top; border-bottom: 1px solid var(--border); }
.controls thead th { background: var(--surface-raised); font-weight: 700; white-space: nowrap; }
.controls tbody th { font-weight: 600; }
.controls tbody tr:last-child > * { border-bottom: 0; }
.controls tbody tr:nth-child(even) { background: rgba(224, 224, 224, 0.025); }
.controls td { color: var(--text-muted); }
.col-icon { margin-right: 0.4rem; }
kbd {
  display: inline-block;
  min-width: 1.6em;
  padding: 0.05em 0.45em;
  font-size: 0.85em;
  line-height: 1.5;
  text-align: center;
  color: var(--text);
  background: var(--bg);
  border: 1px solid var(--border-strong);
  border-bottom-width: 2px;
  border-radius: 4px;
  white-space: nowrap;
}

.concepts { margin: 0; padding: 0; list-style: none; display: grid; gap: 0.75rem; }
.concept { padding: 1rem 1.1rem; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); display: grid; gap: 0.4rem; }
.concept h4 { margin: 0; font-size: 1.0625rem; color: var(--accent); }
.concept p { color: var(--text-muted); font-size: 0.9375rem; }

.dev-block { margin-top: 3rem; }
.dev-block h3 { font-size: 1.25rem; margin-bottom: 1rem; }
.steps { margin: 0; padding: 0; list-style: none; counter-reset: step; display: grid; gap: 1rem; }
.steps li {
  counter-increment: step;
  display: grid;
  grid-template-columns: 2.25rem 1fr;
  gap: 0.75rem;
}
.steps li::before {
  content: counter(step, decimal-leading-zero);
  font-family: var(--font-mono);
  font-size: 0.875rem;
  color: var(--accent);
  padding-top: 0.15rem;
}
.steps strong { display: block; }
.steps p { color: var(--text-muted); }
.commands { margin: 0; padding: 0; list-style: none; display: grid; gap: 0.75rem; }
.command {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 0.25rem 0.75rem;
  align-items: center;
  padding: 0.75rem 0.9rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.command code { background: none; border: 0; padding: 0; font-size: 0.9375rem; color: var(--text); }
.command p { grid-column: 1 / -1; color: var(--text-muted); font-size: 0.9375rem; }
.copy-btn { min-height: 2.25rem; padding: 0.25rem 0.7rem; font-size: 0.875rem; }
.note {
  margin-top: 1.25rem;
  padding: 0.9rem 1rem;
  border-left: 3px solid var(--accent);
  background: var(--surface);
  border-radius: 0 var(--radius) var(--radius) 0;
}

/* ── Roadmap ────────────────────────────────── */
.next {
  margin-bottom: 2.5rem;
  padding: 1.25rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.next h3 { font-size: 1.125rem; margin-bottom: 0.9rem; }
.next ol { margin: 0; padding-left: 1.4rem; display: grid; gap: 0.6rem; }
.next li::marker { font-family: var(--font-mono); color: var(--accent); }
/* Vertikale Timeline: mobil Linie links, ab 768px mittig mit wechselnden Seiten. */
.timeline { position: relative; margin: 0; padding: 0; list-style: none; display: grid; gap: 1.25rem; }
.timeline::before {
  content: "";
  position: absolute;
  top: 0; bottom: 0; left: 7px;
  width: 2px;
  background: var(--timeline-line);
}
.tl-item { position: relative; padding-left: 2rem; }
.tl-node {
  position: absolute;
  top: 1.35rem; left: 2px;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--status-geplant);
  box-shadow: 0 0 0 3px var(--bg);
}
.tl-item[data-status="fertig"] .tl-node { background: var(--status-fertig); }
.tl-item[data-status="in-arbeit"] .tl-node { background: var(--status-in-arbeit); }
.tl-card {
  display: grid;
  gap: 0.5rem;
  padding: 1rem 1.1rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.tl-card h3 { font-size: 1.125rem; }
.tl-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem 0.75rem; }
.tl-time { font-family: var(--font-mono); font-size: 0.875rem; color: var(--text-muted); }
.pill {
  display: inline-block;
  padding: 0.1rem 0.6rem;
  font-size: 0.75rem;
  font-weight: 700;
  line-height: 1.5;
  border-radius: 999px;
  white-space: nowrap;
}
.pill[data-status="fertig"] { background: var(--status-fertig-bg); color: var(--status-fertig-text); }
.pill[data-status="in-arbeit"] { background: var(--status-in-arbeit-bg); color: var(--status-in-arbeit-text); }
.pill[data-status="geplant"] { background: var(--status-geplant-bg); color: var(--status-geplant-text); }
.tl-desc { color: var(--text-muted); font-size: 0.9375rem; }
.bar { height: 6px; background: var(--surface-raised); border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--status-fertig); }
.tl-item[data-status="in-arbeit"] .bar span { background: var(--status-in-arbeit); }
.tl-item[data-status="geplant"] .bar span { background: var(--status-geplant); }
.bar-label { font-size: 0.875rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.tl-card details summary {
  cursor: pointer;
  width: fit-content;
  font-size: 0.9375rem;
  color: var(--accent);
  border-radius: 4px;
  padding: 0.2rem 0;
}
.milestones { margin: 0.6rem 0 0; padding: 0; list-style: none; display: grid; gap: 0.35rem; }
.milestones li { display: grid; grid-template-columns: 3.25rem 1fr auto; gap: 0.5rem; font-size: 0.9375rem; }
.milestones .ms-id { font-family: var(--font-mono); color: var(--text-muted); }
.milestones .ms-count { font-family: var(--font-mono); color: var(--text-muted); font-variant-numeric: tabular-nums; }

/* ── Footer / Repo-Status ───────────────────── */

  function milestoneImage(list) {
    const cols = 8, cell = 46, gap = 8;
    const rows = Math.ceil(list.length / cols);
    const width = cols * cell + (cols - 1) * gap + 2;
    const height = rows * cell + (rows - 1) * gap + 2;
    const stroke = {
      "fertig": cssVar("--status-fertig"),
      "in-arbeit": cssVar("--status-in-arbeit"),
      "geplant": cssVar("--status-geplant")
    };
    const text = cssVar("--text");
    let body = "";
    list.forEach((m, i) => {
      const x = (i % cols) * (cell + gap) + 1;
      const y = Math.floor(i / cols) * (cell + gap) + 1;
      const planned = m.status === "geplant";
      body += `<rect x="${x}" y="${y}" width="${cell}" height="${cell}" rx="6" fill="${stroke[m.status]}" fill-opacity="${planned ? 0 : 0.16}" stroke="${stroke[m.status]}" stroke-width="2"${planned ? ' stroke-dasharray="5 4"' : ""}/>`;
      body += `<text x="${x + cell / 2}" y="${y + cell / 2 + 5}" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="14" fill="${planned ? stroke.geplant : text}">${m.id}</text>`;
    });
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${width} ${height}" width="${width}" height="${height}">${body}</svg>`;
    return "data:image/svg+xml," + encodeURIComponent(svg);
  }

  // ── Anleitung ───────────────────────────────
  async function copyCommand(text, button) {
    let ok = false;
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        ok = true;
      }
    } catch (_) { /* Fallback unten */ }
    if (!ok) {
      const area = h("textarea", { readonly: true, style: "position:fixed;top:0;left:0;opacity:0" });
      area.value = text;
      document.body.append(area);
      area.select();
      try { ok = document.execCommand("copy"); } catch (_) { ok = false; }
      area.remove();
      button.focus();
    }
    button.textContent = ok ? "Kopiert" : "Nicht kopiert";
    announce(ok ? `${text} kopiert` : `${text} konnte nicht kopiert werden`);
    setTimeout(() => { button.textContent = "Kopieren"; }, 1800);
  }

  function note(n) {
    if (!n) return null;
    return h("p", { class: "note" }, [

  /** "[Strg]+[S]" → <kbd>Strg</kbd>+<kbd>S</kbd>; "—" heißt nicht belegt und wird für Screenreader ausgeschrieben. */
  function keyText(text) {
    const value = String(text ?? "").trim();
    if (value === "" || value === "—") {
      return [h("span", { "aria-hidden": "true", text: "—" }), h("span", { class: "visually-hidden", text: "nicht belegt" })];
    }
    const frag = document.createDocumentFragment();
    value.split(/(\[[^\]]+\])/).forEach((part) => {
      if (part) frag.append(/^\[.+\]$/.test(part) ? h("kbd", { text: part.slice(1, -1) }) : rich(part));
    });
    return frag;
  }

  /**
   * Akkordeon nach dem WAI-ARIA-Muster: Überschrift mit Button (aria-expanded, aria-controls),
   * Panel als role="region". Höchstens ein Panel offen; Pfeiltasten, Pos1 und Ende wechseln den Kopf.
   */
  function accordion(id, panels) {
    const root = h("div", { class: "accordion", id });
    const items = [];

    function setOpen(item, open, animate) {
      clearTimeout(item.timer);
      const { panel, button, chevron, wrapper } = item;
      const smooth = animate && !reduceMotion.matches;
      if (open) {
        panel.dataset.open = wrapper.dataset.open = "true";
        button.setAttribute("aria-expanded", "true");
        chevron.textContent = "▾";
        if (!smooth) { panel.style.maxHeight = "none"; return; }
        panel.style.maxHeight = `${panel.scrollHeight}px`;
        // Nach der Animation frei lassen, damit umbrechender Inhalt nicht abgeschnitten wird.
        item.timer = setTimeout(() => { if (panel.dataset.open === "true") panel.style.maxHeight = "none"; }, 320);
      } else {
        if (smooth) {
          panel.style.maxHeight = `${panel.scrollHeight}px`;
          void panel.offsetHeight;
        }
        panel.style.maxHeight = "0px";
        panel.dataset.open = wrapper.dataset.open = "false";
        button.setAttribute("aria-expanded", "false");
        chevron.textContent = "▸";
      }
    }

    function toggle(item) {
      const opening = item.panel.dataset.open !== "true";
      for (const other of items) {
        if (other !== item && other.panel.dataset.open === "true") setOpen(other, false, true);
      }
      setOpen(item, opening, true);
      if (!opening) return;
      // Schließt ein Panel darüber, rutscht der geöffnete Kopf nach oben — dann zurück ins Bild.
      setTimeout(() => {
        const navHeight = document.querySelector(".site-header").offsetHeight;
        if (item.wrapper.getBoundingClientRect().top < navHeight) {
          item.wrapper.scrollIntoView({ behavior: reduceMotion.matches ? "auto" : "smooth", block: "start" });
        }
      }, 330);
    }

    panels.forEach((p, index) => {
      const buttonId = `${id}-${p.id}-kopf`;
      const panelId = `${id}-${p.id}-panel`;
      const chevron = h("span", { class: "acc-chevron", "aria-hidden": "true", text: "▸" });
      const button = h("button", {
        class: "acc-button", id: buttonId, type: "button",
        "aria-expanded": "false", "aria-controls": panelId
      }, [chevron, h("span", { text: p.titel }), p.meta ? h("span", { class: "acc-meta", text: p.meta }) : null]);
      const panel = h("div", {
        class: "acc-panel", id: panelId, role: "region",
        "aria-labelledby": buttonId, "data-open": "false"
      }, h("div", { class: "acc-inner" }, p.inhalt));
      const wrapper = h("div", { class: "acc-item", "data-open": "false" }, [h("h3", { class: "acc-heading" }, button), panel]);
      const item = { button, panel, chevron, wrapper, timer: 0 };
      items.push(item);

      button.addEventListener("click", () => toggle(item));
      button.addEventListener("keydown", (e) => {
        const target = { ArrowDown: index + 1, ArrowUp: index - 1, Home: 0, End: panels.length - 1 }[e.key];
        if (target === undefined) return;
        e.preventDefault();
        items[(target + items.length) % items.length].button.focus();
      });
      root.append(wrapper);
    });

    if (items.length) setOpen(items[0], true, false);
    return root;
  }

  // ── Roadmap ─────────────────────────────────
  /** "M0–M12" oder "M17, M18" → die passenden Einträge aus projectData.meilensteine. */
  function milestonesFor(spec) {
    if (!spec) return [];
    const numbers = new Set();
    for (const part of String(spec).split(",")) {
      const [from, to = from] = part.split(/[–-]/).map((s) => Number(s.trim().replace(/^M/i, "")));
      if (Number.isNaN(from) || Number.isNaN(to)) continue;
      for (let n = from; n <= to; n++) numbers.add(n);
    }
    return milestones.filter((m) => numbers.has(m.nummer));
  }

  function pill(status) {
    const s = STATUS[status] ?? STATUS.geplant;
    return h("span", { class: "pill", "data-status": status }, [h("span", { class: "visually-hidden", text: "Status: " }), s.label]);
  }

  (function renderStatus() {

    const dateNode = date && !Number.isNaN(date.getTime())

    $("status").append(h("div", { class: "wrap" }, [
      h("h2", { id: "status-titel", text: "Repo-Status" }),
      h("dl", { class: "repo-status" }, [
        item("Version", [
          h("span", { class: "mono", text: projectData.version || "TBD" }),
          projectData.versionQuelle ? h("span", { class: "muted", text: ` · aus ${projectData.versionQuelle}` }) : null
        ]),
        item("Lizenz", projectData.license || "TBD"),
        item("Letzter Commit", [
          dateNode,
          c.hash ? [" · ", h("code", { text: c.hash })] : null,
          c.nachricht ? h("span", { class: "muted commit-msg", text: c.nachricht }) : null
        ].flat()),
        item("Zweig & Prüfkette", [r.zweig ? h("code", { text: r.zweig }) : null, r.pruefkette ? [" · ", rich(r.pruefkette)] : null].flat())
      ]),
      h("p", { class: "footer-note" }, [
        r.remote ? ["Remote: ", h("a", { href: r.remote, text: r.remote.replace(/^https?:\/\//, "") }), " · "] : null,
        rich("Momentaufnahme — alle Inhalte stammen aus dem Objekt `projectData` am Anfang des Skripts in dieser Datei.")
      ].flat())
    ]));
  })();

  // ── Scroll-Spy ──────────────────────────────
  (function scrollSpy() {
    const sections = projectData.abschnitte.map((a) => $(a.id)).filter(Boolean);
    const setActive = (id) => navAnchors.forEach((link, key) => {
      if (key === id) link.setAttribute("aria-current", "true");
      else link.removeAttribute("aria-current");
    });
    setActive(sections[0]?.id);
    if (!("IntersectionObserver" in window)) return;

    const visible = new Set();
    const navHeight = document.querySelector(".site-header").offsetHeight;
    const observer = new IntersectionObserver((entries) => {
      for (const entry of entries) {
        if (entry.isIntersecting) visible.add(entry.target.id);
        else visible.delete(entry.target.id);
      }
      const current = sections.filter((s) => visible.has(s.id)).pop();
      if (current) setActive(current.id);
    }, { rootMargin: `-${navHeight}px 0px -55% 0px`, threshold: 0 });
    sections.forEach((s) => observer.observe(s));
  })();

  // ── Tastatur: Escape ────────────────────────
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (menuOpen()) { setMenu(false, true); return; }
    if (openId) closeDetail(true);
  });
})();
</script>
</body>
</html>
