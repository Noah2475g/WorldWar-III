    dod: "Schritt 1 vor Schritt 2: der Grundlauf 'schwer gegen normal' steht datiert in docs/reports/ai-tournament.md mit Siegquote, Kriegserklaerungen und Friedensschluessen je Stufe, bevor packages/ai/src/diplomacy.ts geaendert wird. Danach liegt die Siegquote ausserhalb des Rauschbands aus T-M14-05 und unter der Obergrenze 0,95 - diese Obergrenze wird HIER scharf gestellt, nicht in T-M14-05: dort waere sie gegen die gemessenen 50:0 sofort rot gewesen und haette pnpm test:slow und damit AK-1/4/6, T-M12-03 und den Playtest-Haltepunkt blockiert. Der it.skip aus T-M14-05 entfaellt, und der in PROBLEME.md datierte Ist-Wert wird durch den neuen ersetzt. Grundwert, Endwert und Rauschband mit Status in BALANCING.md, kein Lauf endet 25:25. R-DIP-06/AK1..AK6 je durch einen Verhaltenstest belegt (erzeugtes Kommando, nicht Nutzenzahl) und je AK-Nummer im Anforderungstor aus T-M14-02b gezaehlt; im 50-Partien-Lauf mindestens eine Kriegserklaerung mit Punkteverhaeltnis zwischen 900 und 1100. Kriegsschwelle je Stufe als eigener Regelwert, maxFronts traegt danach nur die Frontenzahl; der Regellader lehnt eine Stufe ohne Kriegsschwelle ab. PublicView.others fuehrt das oeffentliche Ansehen und die oeffentlichen Kriege einer Macht - ohne beides ist AK2 nicht baubar - und wird mit der offers-Erweiterung aus T-M14-12 in derselben Datei zusammengefuehrt. Ansehen und Verstimmungen klingen in packages/core/src/phases/diplomacy.ts ueber playerOrder ab, clone.ts kopiert das neue Record tief (heute kaeme es ueber den Spread als geteilte Referenz durch); der Verstimmungsspeicher ist bereits in T-M15-04 leer angelegt - diese Aufgabe erhoeht SCHEMA_VERSION nicht und aendert persistence/migrate.ts nicht. In 01-REQUIREMENTS.md ist der Teilsatz zu Verstimmungen aus enttarnten Spionen aus R-DIP-06 entfernt und mit Verweis auf M17 in DECISIONS.md begruendet. Determinismus- und Wiedergabetest unveraendert gruen"

