    tests: [apps/desktop/src/ui/Header.test.tsx, apps/desktop/src/ui/format.test.ts]
    dod: "ROHSTOFFE.md D36.2. Je Rohstoff Zeichen, Bestand und ein Pfeil fuer die Richtung; die Bilanzzahl wandert in den Tooltip zu Produktion und Verbrauch, die dort schon stehen. Draengt ein Rohstoff, steht die Reichweite in Tagen als sichtbare Zahl (6 T) - das ist die Auskunft, nach der man handelt, und reachInDays rechnet sie laengst aus. Die Schwelle ist die vorhandene SHORT_REACH_DAYS, keine neue Zahl. R-ECON-06 bleibt erfuellt: die vier Groessen stehen weiter sichtbar in der Wirtschaftstabelle, die Leiste ist nicht die Uebersicht. Test zuerst: ein schrumpfender Vorrat zeigt Tage und Abwaertspfeil, ein wachsender nur den Pfeil, der Tooltip nennt weiterhin Produktion, Verbrauch und Bilanz."
