    design: [D-21]
    files: [packages/mapgen/src/project.ts, data/maps/world.json]
    tests: [packages/mapgen/src/worldmap.geometry.test.ts]
    dod: "796 Punkte Groenlands liegen oberhalb der Leinwand, bis y = -436; der 78-Grad-Beschnitt wird nie geklippt. Fertig, wenn kein Punkt ausserhalb 0..4000 mal 0..2400 liegt und die Kuestenlinie an der Beschnittkante sichtbar durchgehend bleibt, statt zu einer geraden Linie zusammengefaltet zu werden. Eigene Aufgabe, damit der kleine Fehler nicht in der grossen mitschwimmt und unbemerkt bleibt"

  - id: T-M19-04
    milestone: M19
    title: Suedostaustralien ist ein Punkt
    status: done
    deps: [T-M19-02]
    requirements: [R-MAP-08]
    design: [D-21]
    files: [apps/desktop/src/map/picking.ts, docs/plan/DECISIONS.md, docs/plan/PROBLEME.md]
    tests: [apps/desktop/src/map/picking.test.ts]
    dod: "AUS-SE Suedostaustralien ist eine spielbare Provinz von 39 px2, die ganz innerhalb von AUS-NE liegt - zusammengesetzt aus Australian Capital Territory, Jervis Bay und Macquarie-Insel. Quellendatenfehler, nicht Generatorfehler. Fertig, wenn AUS-SE entweder die Flaeche traegt, die ihr Name behauptet, oder verschwindet und ihre Einheiten an AUS-NE gehen. Ein drittes gibt es nicht: eine Provinz, die man nicht anklicken kann, ist keine. Dazu ein Waechter ueber die Mindestgroesse einer SPIELBAREN Provinz, der seine Schwelle nennt. ACHTUNG, diese Aufgabe ist als einzige in M19 KEINE reine Zeichenaenderung: AUS-SE steht in Australiens Startaufstellung, traegt 52097 Einwohner, zwei Vorkommen und drei Kanten. Sie zu streichen aendert die Wirtschaft einer Macht und den Graphen, also die Partie, also AK-1. Die sichere Richtung ist deshalb, ihr die Flaeche zu GEBEN statt sie zu streichen; wird doch gestrichen, gehoert ein neuer pnpm sim:fullgame dazu und die neue Zahl in den Bericht"

  - id: T-M19-05
    milestone: M19
    title: Der Bericht sagt, was die Karte zeigt
    status: done
    deps: [T-M19-02, T-M19-03, T-M19-04]
    requirements: [R-MAP-09]
    design: [D-21]
    files: [docs/reports/map-geometry.md, docs/plan/PROBLEME.md, docs/plan/PROGRESS.md]
    tests: []
    dod: "Vorher/nachher je Pruefung, gegen den Commit gestempelt - wie acceptance.md und packaging.md. Ohne ihn wandert die Zahl 14,2 Prozent als nackte Zahl durch Berichte und wird unterwegs zur Aussage. Dazu wird der Eintrag in PROBLEME.md vom 2026-09-03 berichtigt, der ueber genau diese vier Provinzen feststellte, die Karte zeichne richtig: er war fuer world-shapes.json wahr und fuer world.json falsch. Dazu ein BILDBELEG: der gemeldete Fehler war sichtbar, also gehoert ein Vorher/Nachher-Bild derselben Kartenstelle in den Bericht. Vier Zahlen, die gruen sind, sind kein Nachweis dafuer, dass Noah jetzt Kalifornien sieht"

