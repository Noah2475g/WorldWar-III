    dod: "genau eine Datei unter packages/*/src und apps/*/src nennt runAi und runTicks zugleich (Waechter test/guards/single-loop.test.ts), naemlich packages/ai/src/loop.ts; LOOP_EXCEPTIONS hoechstens 2 Eintraege mit je einem Satz Begruendung; advance.ts ohne for und ohne runTicks, unter 20 Zeilen, App.tsx unveraendert; sechs KI-Maechte handeln in 24 Ticks alle sechs; advanceTicks ist der neue Name der gemeinsamen Schleife - er existiert heute nirgends und wird aus packages/ai/src/loop.ts ausgefuehrt, waehrend apps/desktop/src/game/advance.ts seinen Export advance behaelt und ihn nur noch aufruft; advanceTicks liefert die Ereignisse aller Ticks (mehr als EVENT_LOG_LIMIT=500 im langen Lauf); ein ueber 50 Ticks mit KI gelaufener Stand, in der Mitte gespeichert und geladen, liefert denselben Zustands-Hash wie der ununterbrochene Lauf - damit ist R-AI-07/AK1 (das KI-Gedaechtnis ist Teil des Spielstands) zum ersten Mal geprueft, denn storeMemories schreibt heute ausserhalb der Tick-Pipeline in den Zustand und save.test.ts faehrt seinen Vergleich ohne KI; Golden-Master und Replay ohne Aenderung an apps/headless/test/golden gruen; DECISIONS.md traegt den datierten Eintrag 'genau eine Fortschreibungsschleife' inklusive der Feststellung, dass ueber apps/desktop/src/sim erst R-TIME-06 in T-M15-06 entschieden wird"

  - id: T-M14-05
    milestone: M14
    title: Die Messgeraete richtigstellen und die Rauschgrenze messen
    status: todo
    deps: [T-M14-04]
    requirements: [R-AI-06, R-ARCH-06]
    constraints: [C-10]
    files: [apps/headless/src/sweep.ts, docs/plan/BALANCING.md, docs/plan/PROBLEME.md, docs/reports/balance-sweep.md, docs/reports/balance-sweep.json, docs/reports/ai-tournament.md, docs/reports/worldmap-bench.json]
