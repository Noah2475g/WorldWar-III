    dod: "Zuerst die Messung, dann die Reparatur - in dieser Reihenfolge, sonst ist unbekannt, was die Reparatur bewirkt hat. (a) R-AI-04 wird auf der ausgelieferten Weltkarte mit acht KI-Maechten gemessen, so wie R-ARCH-06/AK1 es seit dem 2026-09-06 wird; die Zusicherung wandert dazu nach worldmap.bench.slow.test.ts, und was in tick.bench.slow.test.ts bleibt, traegt wie der Nachbarblock den Vermerk, dass es die Anforderung NICHT belegt. Der Ausgangswert wird festgehalten, bevor eine Zeile Produktionscode faellt. (b) Zwei Schnitte, jeder einzeln gemessen: visibleProvinces laeuft nicht mehr zweimal je Macht und Tick (heute einmal in updateIntel, einmal in publicView, ueber denselben Zustand im selben Tick), und der unveraenderliche Teil der Provinzsicht - id, name, kind, terrain, coastal, neighbors, seaLinks - wird einmal je Karte gebaut statt je Macht und Tick neu abgeschrieben. publicView.test.ts belegt, dass die Sicht danach dieselbe ist: gleicher Inhalt, gleiche Reihenfolge, und kein Aufrufer kann den geteilten Teil veraendern. (c) ai-bench.json fuehrt aiMedianMs und tickMedianMs einzeln fort, nicht nur den Quotienten - ein gestiegener Anteil kann von beidem kommen. (d) Faellt die Messung gegen die Anforderung aus, wird sie nachgemessen und begruendet wie R-ARCH-06 am 2026-09-06, mit Eintrag in DECISIONS.md und Noahs Entscheidung; das blosse Anheben der Grenze, damit die Zahl passt, ist ausgeschlossen. Nach dieser Aufgabe ist die Zusicherung im Bench nicht mehr lockerer als die Anforderung, die sie vertritt - heute sichert sie 0,5 zu, wo die Anforderung 0,30 sagt. pnpm verify und pnpm test:slow gruen"

  - id: T-M16-03
    milestone: M16
    title: Der erste Bau
    status: done
    deps: [T-M16-01]
    requirements: [R-PKG-01, R-FREE-04]
    constraints: [C-02]
    files: [package.json, pnpm-lock.yaml, .gitignore, scripts/build-icon.mjs, apps/desktop/src-tauri/tauri.conf.json, apps/desktop/src-tauri/Cargo.lock, apps/desktop/src-tauri/icons/icon.png, apps/desktop/src-tauri/icons/icon.ico]
    tests: [test/guards/packaging.test.ts]
    dod: "Der Auslieferungspfad wird zum ersten Mal ausgefuehrt. Reihenfolge nicht beliebig: erst das Symbol, weil tauri.conf.json es verlangt und ein Bau, der daran scheitert, ueber den Rest nichts sagt; es wird selbst erzeugt und nicht bezogen (R-ASSET-01). Dann die Abhaengigkeiten - tauri-apps/cli und tauri-apps/api stehen in package.json UND im Lockfile, das heute null Treffer fuer tauri hat. Dann der Bau: pnpm tauri:build laeuft durch und erzeugt ein startfaehiges Erzeugnis, Cargo.lock liegt danach im Baum. Der Waechter packaging.test.ts bekommt einen zweiten Teil, der an Dingen haengt, die nur ein Bau erzeugt: heute vergleicht er tauri.conf.json gegen capabilities/local-only.json - zwei Dateien derselben Hand - und bleibt gruen, wenn nie ein Bau lief. Der erste Teil bleibt unveraendert: R-FREE-04 in der Konfiguration ist richtig geprueft, er ist nur nicht der Beleg fuer einen Bau. Was der Bau an Werkzeug braucht, wird im Fortschrittseintrag genannt: Rust ist vorhanden, der erste cargo-Lauf bezieht die Crates aus dem Netz - Freigabe von Noah am 2026-09-06"

  - id: T-M16-04
    milestone: M16
    title: Der Datei-Port
    status: done
    deps: [T-M14-08, T-M16-03]
    requirements: [R-PKG-02, R-GAME-03, R-GAME-04]
    constraints: [C-02]
    files: [apps/desktop/src/storage/TauriStorage.ts, apps/desktop/src/storage/createStorage.ts, packages/core/src/persistence/StoragePort.ts, docs/plan/PROGRESS.md]
    tests: [apps/desktop/src/storage/TauriStorage.test.ts, test/guards/persistence-contract.test.ts]
    dod: "Der Port tritt als DRITTE Umsetzung zu Memory und IndexedDB und aendert an createStorage und storagePortContract nichts: er erfuellt denselben Vertrag oder er ist falsch. Damit ist die Zusage von T-M8-00 zum ersten Mal ihrem Wortlaut nach erfuellt - dieselbe Vertragstestreihe gegen alle drei Umsetzungen -, die seit M8 dastand und deren Dateien nie existierten; T-M8-00 wird von dieser Aufgabe geschlossen und traegt sie im Feld reopened. Die zweite Pruefung ist die eigentliche (R-PKG-02/AK2): ein ausserhalb des Programms geloeschter Stand verschwindet aus der Liste. Ohne sie waere ein Port gruen, der die Namen nur im Speicher fuehrt und beim Start einmal einliest - genau die Umsetzung, die im Vertrag nicht auffaellt, weil der Vertrag den Prozess nie verlaesst. Der Waechter persistence-contract faellt weiterhin, sobald nur eine Fabrik registriert ist. pnpm verify gruen"

  - id: T-M16-05
    milestone: M16
    title: AK-8 gemessen
    status: done
    deps: [T-M16-03, T-M16-04]
    acceptance: [AK-8]
    requirements: [R-PKG-01, R-PKG-02]
