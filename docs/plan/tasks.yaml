    dod: "pnpm verify gruen: die Frage zu R-GAME-01 nennt jede Wahlmoeglichkeit der Anforderungszeile mit der Karte zuerst; je eine Frage zu R-GAME-01, R-GAME-02, R-GAME-03, R-GAME-04, R-BAT-05, R-BAT-07, R-PROV-01; je eine Frage zu Neustart des Fensters und zur Schrift IBM Plex; die Anleitung erklaert Rueckzug, Kampfbericht und Bauabbruch. Der vierte Haltepunkt und der Waechter wandern in EINER Aenderung: diese Aufgabe traegt gate: true und gate_reason ('Noah spielt die V1 nach dem ueberarbeiteten docs/PLAYTEST.md (AK-7); ohne seine Antworten in docs/reports/playtest-v1.md ist T-M12-03 nicht abschliessbar') in tasks.yaml nach UND setzt im selben Zug die hart verdrahtete Gate-Liste in test/plan-consistency.test.ts auf ['T-M9-01','T-M10-01','T-M12-03','T-M14-15']; bis dahin steht der gate:-Block mit Absicht NICHT in tasks.yaml, damit der Plan-Waechter waehrend des ganzen Meilensteins gruen bleibt und die Zusage 'pnpm verify gruen' in jeder M14-Aufgabe erfuellbar ist. Der Waechter prueft danach zusaetzlich, dass jede Aufgabe mit gate: true in der Haltepunkttabelle von 03-TASKS.md steht. T-M12-03 haengt in beiden Plandateien an T-M12-01, T-M12-02b und T-M14-15 (T-M14-14 kommt ueber die deps von T-M14-15 mit) und fasst seine DoD auf den V1-Satz - beides ist bereits in beiden Dateien eingetragen und bleibt hier nur zu pruefen. Haltepunkt erfuellt, wenn docs/reports/playtest-v1.md jede Frage beantwortet und jedes Nein in der Befundtabelle traegt"

