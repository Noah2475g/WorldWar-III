    dod: "Laeuft als letzte Aufgabe von M15; T-M15-09 steht nur deshalb in den deps, damit 'zuletzt' auch numerisch stimmt - sachlich haengt das Tor nicht am Protokollfilter. Weltkarte, 8 KI, 200 Spieltage, gezaehlt aus runTicks(...).events statt aus dem Ringpuffer state.eventLog: RESOURCE_SHORTAGE mit resource money = 0; COMMAND_REJECTED mit dem Freischaltungscode aus R-TECH-01 = 0; COMMAND_REJECTED mit INVALID_TARGET aus diplomatischen Kommandos = 0 (heute 405 von 408). Turnier mit den drei Paarungen schwer/leicht, schwer/normal, normal/leicht: playMatch liefert die Ereigniszahl je Stufe, playTournament summiert sie. Gemessen wird, was M15 hinzufuegt, nicht was M14 schon zusichert - der blosse Existenznachweis fuer Handel entfaellt, weil T-M14-12 bereits mindestens ein TRADE_EXECUTED je KI-Macht verlangt: fuer jede der drei Stufen mindestens ein SELBSTTAETIGES Beschussereignis aus T-M15-07, mindestens eine Kriegserklaerung, die aus dem Verhaeltnis nach R-DIP-06 entsteht und nicht aus der Frontenzahl, und mindestens ein Handel ueber der neuen Regelmarge; in mindestens der Haelfte der Partien jeder Stufe liegt von jeder Art mindestens eine vor. Tabelle mit Datum in docs/reports/ai-tournament.md; Handelsmarge, Angebotsmarge und Ruecklage mit Status in BALANCING.md. In 01-REQUIREMENTS.md ist R-AI-08 auf das gekuerzt, was V1.2 baut: AK1 (Gegenspion) reist mit R-SPY nach M17, und die Spionageklausel in AK3 ist aus dem AK-Text entfernt - sonst ist dieses Tor unerfuellbar; beides mit Verweis auf Entscheidung 3 in DECISIONS.md begruendet"

  - id: T-M15-09
    milestone: M15
    title: Weltgeschehen - ein Filter statt einer Zeitung
    status: done
    deps: [T-M13-13, T-M15-01]
    requirements: [R-GAME-06, R-NEWS-04]
    files: [packages/core/src/events/world.ts, packages/core/src/index.ts, apps/desktop/src/ui/Panels.tsx, apps/desktop/src/App.tsx, apps/desktop/src/game/events.ts, apps/desktop/src/i18n/de.ts, docs/plan/01-REQUIREMENTS.md, docs/plan/DECISIONS.md]
    tests: [packages/core/src/events/world.test.ts, apps/desktop/src/ui/Panels.test.tsx, apps/desktop/src/game/events.test.ts, apps/desktop/src/ui/Alerts.test.tsx]
    dod: "R-NEWS-01/02/03 gestrichen (Entscheidung 3 vom 2026-09-05), ersetzt durch den fuenften Protokollfilter Weltgeschehen aus derselben Positivliste. WORLD_EVENT_TYPES enthaelt genau acht Arten (WAR_DECLARED, DIPLOMACY_CHANGED, PROVINCE_CAPTURED, CAPITAL_LOST, PROVINCE_REVOLTED, PLAYER_ELIMINATED, BATTLE_RESOLVED, GAME_ENDED); Eigenschaftstest ueber zufaellige Ereignisfolgen: worldEventsIn liefert nur diese Arten, in Protokollreihenfolge, und ignoriert die audience aus T-M15-01. Eine fremde Kriegserklaerung steht unter Weltgeschehen und unter alles, aber ohne log__row--alert; gefiltert wird VOR dem slice(-40), das in App.tsx das Protokoll fuer die Ereignisleiste zuschneidet (Anker ist dieser Ausdruck, keine Zeilennummer - dieselbe Aufgabe schreibt die Stelle um), sonst findet der Filter in einer langen Partie regelmaessig eine leere Liste. Eine Zeile ausserhalb der eigenen audience traegt nur Art, Beteiligte, Ort - keine Ziffer, keine Kennung, keine losses; die beiden deutschen Saetze mit stillschweigendem 'ich' (Verhaeltnis zu, Die Hauptstadt ist verloren) bekommen eine zweite Fassung aus fremder Sicht. Kein neues Zustandsfeld: state/types.ts unveraendert, HASH_OMIT_KEYS bleibt ['eventLog']; diese Aufgabe erhoeht SCHEMA_VERSION nicht, fuegt keine Migration hinzu und laesst beide Golden-Master unter packages/core/test/golden und apps/headless/test/golden byteweise unveraendert - Nachweis git diff --stat, bei gruenem determinism.test.ts und replay.test.ts (die Absolutaussage 'SCHEMA_VERSION bleibt 1' ist falsch, seit T-M15-04 sie auf 2 hebt). alertsFor und firstAlertFor liefern dieselbe Menge wie vorher; der Klang liest weiterhin das Protokoll und wandert beim Umbau in App.tsx nicht mit. grep -rn R-NEWS trifft nur noch DECISIONS.md; der scope-Block traegt nach der Streichung 97 IDs, davon 15 spaetere, und pnpm coverage:requirements meldet weiterhin 'V1 offen: 0'"

