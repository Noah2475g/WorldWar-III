    tests: [test/withdrawals.test.ts, packages/core/src/phases/occupation.test.ts]
    dod: "DECISIONS.md enthaelt sieben Eintraege vom 2026-09-05 zu T-M14-03: die sechs Ruecknahmen (Gebaeudeunterhalt, Einheitenmoral, Garnison und Rebellenarmee, E2E-Ebene, Zeitsieg-Auswahl, Uebergangsmalus) und als siebten die Praezisierung von C-02 nach Entscheidung 2 - der Wortlaut in 01-REQUIREMENTS.md lautet danach 'V1: Browserbau mit dauerhaftem Speicher (IndexedDB); Tauri-Verpackung mit Datei-Port in M16, mit eigenem Abnahmekriterium AK-8' statt 'Savegames im echten Dateisystem', damit T-M14-08 nicht gegen eine gueltige Rahmenbedingung baut und M16 ein Abnahmekriterium bekommt statt einer Absichtserklaerung. grep crossingFactor ueber packages und apps liefert 0 Treffer; 02-DESIGN.md nennt weder Playwright noch Garnison-Unterdrueckung noch Aufstaendischen-Armee; der Zeitsieg-Zweig in victory.ts wird von genau einem Test ausgefuehrt. Die acht kleineren Befunde ohne Aufgabe stehen danach entweder als ausdrueckliche Ruecknahme in DECISIONS.md oder mit Meilenstein in docs/plan/PROBLEME.md - keiner bleibt zwischen 'nicht gebaut' und 'nicht entschieden' liegen: die unausgefuehrten Zeichenzeilen in MapCanvas.tsx samt unbelegtem R-ARCH-06/AK2, die nach der Ruecknahme des Gebaeudeunterhalts offene zweite Kohlesenke, R-AI-04 gemessen ueber der Zusage bei gruenem Test, die kostenlose Hauptstadtverlegung, der 350-fache Vorratsaufbau, die Regelzahlen ohne Belegstatus, der Rueckzug als Teleport und die fehlende Pruefung von Tastatur, Fokus und aria. pnpm coverage:requirements meldet weiterhin 'V1 offen: 0'; pnpm verify gruen"

