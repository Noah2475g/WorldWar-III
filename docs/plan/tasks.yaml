    files: [packages/core/src/state/types.ts, packages/core/src/state/clone.ts, packages/core/src/persistence/migrate.ts, packages/core/src/persistence/save.ts, packages/core/src/persistence/validate.ts, packages/core/src/persistence/index.ts, docs/plan/01-REQUIREMENTS.md, docs/plan/02-DESIGN.md, docs/plan/DECISIONS.md, packages/core/test/golden/save-v1.json]
