    dod: "Der Auslieferungspfad wird zum ersten Mal ausgefuehrt. Reihenfolge nicht beliebig: erst das Symbol, weil tauri.conf.json es verlangt und ein Bau, der daran scheitert, ueber den Rest nichts sagt; es wird selbst erzeugt und nicht bezogen (R-ASSET-01). Dann die Abhaengigkeiten - tauri-apps/cli und tauri-apps/api stehen in package.json UND im Lockfile, das heute null Treffer fuer tauri hat. Dann der Bau: pnpm tauri:build laeuft durch und erzeugt ein startfaehiges Erzeugnis, Cargo.lock liegt danach im Baum. Der Waechter packaging.test.ts bekommt einen zweiten Teil, der an Dingen haengt, die nur ein Bau erzeugt: heute vergleicht er tauri.conf.json gegen capabilities/local-only.json - zwei Dateien derselben Hand - und bleibt gruen, wenn nie ein Bau lief. Der erste Teil bleibt unveraendert: R-FREE-04 in der Konfiguration ist richtig geprueft, er ist nur nicht der Beleg fuer einen Bau. Was der Bau an Werkzeug braucht, wird im Fortschrittseintrag genannt: Rust ist vorhanden, der erste cargo-Lauf bezieht die Crates aus dem Netz - Freigabe von Noah am 2026-09-06"

  - id: T-M16-04
    milestone: M16
