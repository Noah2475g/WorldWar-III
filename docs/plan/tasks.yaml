    dod: "die Einstellungen ueberleben den Neustart - parseSettings bekommt endlich einen Aufrufer und ein gespeicherter Wert (Tempo, Schriftgroesse, Ton) steht nach dem Neuladen wieder da (schliesst T-M10-09, das seit dem 2026-09-06 auf diese Aufgabe zeigt); storagePortContract laeuft gegen mindestens zwei Umsetzungen (Memory, IndexedDB) und der Waechter persistence-contract faellt, sobald nur eine Fabrik registriert ist; ein ueber eine verworfene IndexedDbStorage-Instanz geschriebener Stand liefert aus einer neuen Instanz denselben Zustands-Hash; der Vertrag deckt fehlschlagendes Schreiben, halb geschriebenen Stand und zwei Schreibvorgaenge auf denselben Namen ab; ohne indexedDB meldet createStorage volatile true und die Oberflaeche zeigt den Hinweis; ein unlesbarer Platz erscheint als unlesbar statt leer und laesst sich laden; nach simuliertem Neustart trifft der naechste Automatikstand den Platz mit dem kleinsten savedAtTick. vitest.config.ts nimmt main.tsx nicht mehr von der Abdeckung aus - an dieser Datei haengen die Auslieferungsbefunde, und die AK-3-Schwellen (Kern 90 Prozent, gesamt 80 Prozent) bleiben danach gehalten. Diese Aufgabe baut gegen das von T-M14-03 praezisierte C-02 (V1 im Browser mit dauerhaftem Speicher, Datei-Port und Tauri-Bau in M16) und aendert den Status von T-M8-00 NICHT selbst: die Rueckstufung samt Begruendung liegt bei T-M14-02, hier steht nur der eigene Fortschrittseintrag in PROGRESS.md"

