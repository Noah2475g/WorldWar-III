    tests: [packages/core/src/phases/construction.test.ts, packages/core/test/determinism.test.ts, apps/desktop/src/ui/Panels.test.tsx]
    dod: "FORTSCHRITT.md D34.3 - die EINZIGE Kernaenderung dieses Meilensteins. Befund: build.ts zieht rule.cost unveraendert ab und setzt completionTick aus rule.buildTicks, die Stufe ist reine Buchfuehrung; Fabrik Stufe 3 kostet so viel wie Stufe 1. Zwei neue Konstanten buildLevelCostPermille (1800) und buildLevelTimePermille (1500), angewandt als Faktor hoch Stufe minus eins. Das Bauplatz-Raster und der Ausbau-Knopf zeigen den Preis der NAECHSTEN Stufe, nicht den der ersten. Test zuerst: Stufe 1 kostet unveraendert, Stufe 3 kostet das 3,24-fache und dauert das 2,25-fache; ein Auftrag, der fuer Stufe 1 reicht, wird fuer Stufe 3 mit INSUFFICIENT_RESOURCES abgelehnt. Golden-Master neu erzeugen und begruenden."
