    dod: "ROHSTOFFE.md Abschnitt 3 - die Korrektur eines eigenen Vorschlags. Der Vorschlag lautete eine Spalte streichen; das geht nicht, weil R-ECON-06 woertlich verlangt, dass Bestand, Produktion je Tag, Verbrauch je Tag UND Bilanz je Ressource sichtbar sind. Alle vier bleiben. Stattdessen: nur Bestand und Bilanz tragen Gewicht, die sieben Nullen der Unterhaltsspalte werden zu Strichen in Linienfarbe, und die Farbe gehoert allein der Bilanz. Test zuerst: alle vier Spalten sind weiter im Baum vorhanden (R-ECON-06 bleibt belegt) und eine Null wird als Strich ausgegeben, ohne dass der Vorlesetext sie verliert."
