  - { id: M9,  title: Weltkarte }
  - { id: M10, title: Oberflaeche }
  - { id: M11, title: Look, Ton, Verpackung }
  - { id: M12, title: Balancing und Abnahme }
  - { id: M13, title: Oberflaeche im Ausbau }
  # Neue Meilensteinachse, festgelegt von Noah am 2026-09-05 (ENTSCHEIDUNGEN, Achse).
  # Sie ersetzt die alten "M15"-Verweise im scope-Block von 01-REQUIREMENTS.md 2.15.
  - { id: M14, title: Der Stand wird wieder wahr }
  - { id: M15, title: Die KI wird ein Gegner }
  - { id: M16, title: Verpackung als Programm }
  - { id: M17, title: Tiefe zwischen den Kriegen }
  - { id: M18, title: Spaeter }
  # Aus dem Abnahme-Playtest vom 2026-09-07: Noah hat einen Kartenfehler gefunden, und die
  # Untersuchung hat ihn als systematisch nachgewiesen (130 von 237 Provinzen).
  - { id: M19, title: Die Karte zeigt, was da ist }
  - { id: M20, title: Die Karte spricht mit }
  # Noahs zweiter Wunsch vom 2026-09-07: der Spieler soll wissen, was er anklicken muss,
  # um voranzukommen. Die bestehende Einstiegshilfe erklaert die Bedienung, nicht das Spiel.
  - { id: M21, title: Die ersten Spieltage fuehren }

