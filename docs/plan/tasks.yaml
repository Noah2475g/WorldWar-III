  # Planregel fuer alle Aufgaben ab hier (Maengelliste F3): beide Plandateien werden je
  # Aufgabe gemeinsam gepflegt. docs/plan/03-TASKS.md wird deshalb nicht mehr in jeder
  # files-Liste einzeln gefuehrt; T-M14-01 haelt die Regel in 03-TASKS.md fest.

  - id: T-M14-01
    milestone: M14
    title: Meilensteinachse im scope-Block, Tor prueft V1 hart
    status: done
    deps: []
    requirements: [R-ARCH-05]
    acceptance: [AK-2]
    files: [docs/plan/01-REQUIREMENTS.md, scripts/requirements-coverage.mjs, scripts/acceptance.mjs, docs/plan/tasks.yaml, docs/plan/03-TASKS.md]
    tests: [test/requirements.test.ts, test/plan-consistency.test.ts]
    dod: "pnpm coverage:requirements meldet 'V1 offen: 0' und endet mit Exit 0; jede in Abschnitt 2.15 gefuehrte ID traegt ein Fach mit Meilenstein und Begruendung, und eine ID ohne Fach bleibt V1-Pflicht - die DoD nennt bewusst keine feste Zahl, weil T-M15-09 drei IDs streicht; ein later-Eintrag ohne Begruendung oder mit einem in tasks.yaml unbekannten Meilenstein bricht mit Exit 1 ab; der milestones-Block von tasks.yaml fuehrt M14 Der Stand wird wieder wahr, M15 Die KI wird ein Gegner, M16 Verpackung als Programm, M17 Tiefe zwischen den Kriegen und M18 Spaeter, und 03-TASKS.md traegt die zugehoerigen Ueberschriften - ohne diese fuenf Zeilen faellt der Waechter 'jede Aufgabe gehoert zu einem deklarierten Meilenstein' bei der ersten M14-Aufgabe; kein Verweis in 2.14/2.15 nennt einen Meilenstein, den die neue Achse nicht kennt, und der Satz zu R-ECON-05/R-DIP-05 ist entfernt; R-NEWS-01/02/03 bekommen das Fach M17 mit dem Hinweis auf die Ersetzung durch den Filter Weltgeschehen, ihren Anforderungstext fasst T-M15-09 an, nicht diese Aufgabe; 03-TASKS.md traegt als Planregel, dass beide Plandateien je Aufgabe gemeinsam gepflegt werden und 03-TASKS.md deshalb nicht mehr in jeder files-Liste einzeln erscheint; AK-2 in scripts/acceptance.mjs liest die Zeile 'V1 offen:' ohne den Exit-Code zu maskieren"

  - id: T-M14-02
    milestone: M14
    title: Plan-Waechter prueft files und tests jeder erledigten Aufgabe
    status: done
    deps: [T-M14-01]
    requirements: [R-ARCH-05]
    files: [test/plan-paths.ts, docs/plan/tasks.yaml, docs/plan/PROGRESS.md, docs/plan/PROBLEME.md]
    tests: [test/plan-consistency.test.ts]
    dod: "Zuerst der Arbeitsbaum: git status --short ist leer, die 13 Sondendateien unter apps/headless/test/zz*, packages/core/src/phases/zzz-skeptic-hull.test.ts und coverage-audit/ sind geloescht oder als echte Tests aufgenommen, und docs/plan/PROBLEME.md nennt, welche - solange sie im Baum liegen, misst jedes 'pnpm verify gruen' eine andere Testmenge als das Projekt. Dann der Waechter: die Zahl der nicht existierenden files-/tests-Pfade bei status done ist 0 (vorher 79 in 43 Aufgaben); ein Verzeichniseintrag mit Schraegstrich muss ein Verzeichnis sein; ein Test an einer erfundenen Aufgabenliste zeigt, dass ein einziger falscher Pfad bei status done den Lauf rot macht. Jede done-Aufgabe, deren fehlender Pfad keine Umbenennung ist, steht danach auf todo und traegt im Feld reopened die Aufgabe, die sie schliesst - ohne Besitzer keine Rueckstufung: T-M8-00 ist abgeloest durch T-M14-08 (Browserspeicher jetzt, Datei-Port erst in M16, kein Neubau des alten Entwurfs), T-M10-04 wird geschlossen durch T-M15-06; fuer T-M10-09 (Settings.tsx, Settings.test.tsx) und T-M0-03 (test/guards/core-purity.test.ts) ist die schliessende Aufgabe hier zu benennen oder die Zusage nach T-M14-03 zurueckzunehmen. Der T-M8-00-Eintrag im Abschnitt der erledigten Aufgaben von PROGRESS.md wird entsprechend gefasst (Anker ist der Eintrag, nicht eine Zeilennummer - diese Aufgabe schreibt die Datei selbst um). Zwei der 79 Pfade duerfen NICHT auf bestehende Dateien umgebogen werden: packages/core/test/properties/combat-conservation.test.ts und packages/core/src/commands/bombard.test.ts entstehen in T-M14-06 und T-M14-07. pnpm verify gruen"

  - id: T-M14-02b
    milestone: M14
    title: Das Anforderungstor zaehlt Akzeptanzkriterien statt Namen
    status: done
    deps: [T-M14-02]
    requirements: [R-ARCH-05]
    acceptance: [AK-2]
    files: [scripts/requirements-coverage.mjs, test/plan-consistency.test.ts, docs/plan/01-REQUIREMENTS.md, docs/plan/DECISIONS.md]
    tests: [test/requirements.test.ts, test/plan-consistency.test.ts]
    dod: "T-M14-01 repariert den Nenner, diese Aufgabe den Zaehler: requirements-coverage.mjs zaehlt je Akzeptanzkriterium statt je ID. Belegt ist eine AK-Nummer, wenn ein describe-Block ihren Namen in der Form 'R-DIP-06/AK1' traegt und mindestens eine Zusicherung enthaelt; eine ID gilt erst als belegt, wenn jede ihrer AK-Nummern belegt ist - heute genuegt ein einziges describe mit dem ID-Namen, und das Akzeptanzkriterium wird nie gelesen. Fuer die bereits belegten IDs traegt das Skript eine datierte Uebergangsliste, die je ID nennt, welche AK-Nummern noch auf der alten Namenszaehlung stehen; ein Test sichert zu, dass die Liste nur schrumpft, und jede ab M14 neu belegte ID laeuft ohne Uebergangseintrag - R-DIP-06/AK1..AK6 und R-BAT-08/AK1..AK3 aus M15 werden also einzeln gezaehlt. Zusaetzlich prueft plan-consistency die bisher ungepruefte Richtung Anforderung nach Aufgabe: jede vom scope-Block als V1-pflichtig gefuehrte ID kommt in mindestens einer Aufgabe in tasks.yaml und in mindestens einem Abschnitt von 02-DESIGN.md vor - genau der Weg, auf dem die IDs aus 2.15 ohne Entwurf und ohne Aufgabe gruen durchliefen. Ein Selbsttest an einer erfundenen Anforderung mit zwei AK und nur einem Testblock macht das Tor rot. DECISIONS.md haelt fest, dass die Uebergangsliste ein datierter Schuldschein ist und kein Dauerzustand; pnpm verify und pnpm coverage:requirements gruen"

  - id: T-M14-03
    milestone: M14
    title: Zurueckgenommene Zusagen kuerzen und begruenden
    status: done
    deps: [T-M14-01, T-M14-02]
    requirements: [R-BAT-03, R-ECON-03, R-GAME-02, R-PROV-03, R-UNIT-07]
