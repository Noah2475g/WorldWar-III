  # --- Befunde des Abnahme-Playtests vom 2026-09-06 -------------------------------------
  # Sie gehoeren zu M12, weil T-M12-03 das Tor ist, das sie blockieren: ein Playtest, der
  # dreizehn Nein liefert, ist kein bestandener Playtest. Reihenfolge nach Schwere.

  - id: T-M12-04
    milestone: M12
    title: Der Abbruchknopf bekommt sein Wort zurueck
    status: done
    deps: [T-M12-02b]
    requirements: [R-UI-07]
    files: [apps/desktop/src/game/actions.ts, apps/desktop/src/i18n/de.ts]
    tests: [test/guards/prose-in-code.test.ts, test/guards/text-keys.test.ts]
    dod: "Auf dem Bildschirm stand unter 'Im Bau' die Zeichenfolge [province.cancelBuild] - der Knopf wirkte, nur sein Name fehlte. Ursache ist ein Wort: actions.ts fragte province.cancelBuild ab, der Katalog fuehrt actions.cancelBuild; in derselben Datei stehen 23 Aufrufe t('army...'), drei t('market...'), drei t('actions...') und genau dieser eine Ausreisser. Die Beschriftung nennt jetzt das Gebaeude, weil eine Provinz mit mehreren Auftraegen sonst mehrere gleiche Knoepfe zeigt. Der eigentliche Teil ist der Waechter: text.test.ts prueft den Katalog nur in EINER Richtung (fuer jede Ereignisart, jeden Rohstoff, jedes Gebaeude gibt es einen Satz) und nie, ob ein vom Code abgefragter Schluessel existiert; verschaerfend hat der Sichtbarmacher fuer fehlende Schluessel einen eigenen gruenen Test, der Mechanismus vor dem Spieler war also geprueft. Der neue Waechter sammelt jeden statisch geschriebenen t('a.b') im Produktionscode und verlangt den Schluessel - gegen den Baum vor der Reparatur meldete er genau einen Verstoss und keinen Fehlalarm -, prueft die Menge auf Nichtleere und nennt die Zahl der zusammengesetzten Aufrufe, die er NICHT aufloesen kann"

  - id: T-M12-05
    milestone: M12
    title: Der Startdialog sagt, was Gewinnen heisst
    status: done
    deps: [T-M12-02b]
    requirements: [R-GAME-02]
    files: [apps/desktop/src/ui/Dialogs.tsx, apps/desktop/src/i18n/de.ts]
    tests: [apps/desktop/src/ui/Dialogs.test.tsx]
    dod: "Punkte und Eroberung waren waehlbar und nirgends erklaert, waehrend das Feld darueber (Startzahl) einen erklaerenden Satz trug - die Wahl entscheidet aber, wie die Partie endet. Der Hinweis nennt jetzt die Schwelle aus newGame.ts (Punkte 700, Eroberung 1000 von 1000) und wechselt mit der Auswahl; ein Hinweis, der sich nicht aendert, erklaert keine Wahl. Der Test haelt Satz und Schwelle zusammen, sodass eine geaenderte Zahl ohne geaenderten Satz faellt, und prueft ausserdem, dass das Feld seinen Wert nach oben meldet - genau das, was das Kartenfeld daneben nicht tut (T-M12-08)"

  - id: T-M12-06
    milestone: M12
    title: Die zweite Partie beginnt wirklich
    status: done
    deps: [T-M14-10]
    requirements: [R-GAME-01, R-UI-13]
    files: [apps/desktop/src/App.tsx]
    tests: [apps/desktop/src/App.test.tsx]
    dod: "Der Endedialog bietet 'Neue Partie' an, und der Klick fuehrt ins Leere: er schliesst den Dialog, oeffnet keinen Startdialog und laesst den Spieler in der beendeten Partie zurueck (gemessen an Tag 171: Siegziel 0 Prozent, jede Produktion null, keine Dialoge im DOM). Nur Neuladen hilft. T-M14-10 hat genau diesen Weg als erledigt gemeldet - der Test dort prueft offenbar den Zustand, nicht die Sicht. Fertig, wenn ein Test die KETTE prueft: Partie beenden, 'Neue Partie' klicken, Startdialog steht da, Partie beginnen, neuer Tag 1 - alles ohne Neuladen. Waehrend einer laufenden Partie gibt es ebenfalls keinen Weg zu einer neuen; ob das so bleibt, ist eine Entscheidung und gehoert in DECISIONS.md"

  - id: T-M12-07
    milestone: M12
    title: Die Spielstaende sind erreichbar, auch nach dem Neustart
    status: done
    deps: [T-M14-08]
    requirements: [R-GAME-03, R-UI-05]
    files: [apps/desktop/src/App.tsx, apps/desktop/src/ui/Header.tsx, apps/desktop/src/ui/Dialogs.tsx]
    tests: [apps/desktop/src/App.test.tsx]
    dod: "Der Stand ueberlebt korrekt (IndexedDB fuehrt stand-1 nach dem Neuladen), ist aber nicht erreichbar: die Liste oeffnet ausschliesslich Strg+S, kein Knopf fuehrt dorthin, und ohne laufende Partie wirkt die Tastenkombination nicht - wer das Fenster schliesst, kommt an seinen Spielstand nicht mehr heran. Dazu eine Sackgasse: schliesst man den Startdialog mit dem Kreuz, bleibt eine leere Flaeche mit 'Die Welt wird aufgebaut ...', aus der kein Knopf und keine Taste herausfuehrt. Fertig, wenn (a) die Spielstaende ohne Tastatur erreichbar sind, (b) sie auch VOR der ersten Partie erreichbar sind, damit ein gespeicherter Stand geladen werden kann, und (c) der leere Zustand keine Sackgasse mehr ist. R-UI-05 verlangt jede Aktion per Klick; eine nur ueber die Tastatur erreichbare Funktion erfuellt das nicht"

  - id: T-M12-08
    milestone: M12
    title: Die Kartenwahl wirkt
    status: done
    deps: [T-M14-03]
    requirements: [R-GAME-01]
    files: [apps/desktop/src/main.tsx, apps/desktop/src/App.tsx, apps/desktop/src/game/newGame.ts]
    tests: [apps/desktop/src/App.test.tsx]
    dod: "Blindschalter, und Befund 38/N10 ist damit NICHT geschlossen: 'Kleine Welt (12)' gewaehlt startet weiterhin die Weltkarte - gemessen an den Provinznamen (Mittlerer Westen, Ostkanada gegen Hafen, Waldland, Bergland in testworld.json). Verschaerfend hat docs/PLAYTEST.md:149 behauptet, der Befund sei geschlossen; die Zeile ist am 2026-09-06 berichtigt. Fertig, wenn ein Test die Kette prueft: Karte im Dialog umstellen, Partie beginnen, die Provinzzahl des Zustands entspricht der gewaehlten Karte. Der Test darf NICHT gegen den Dialogzustand pruefen, sondern gegen die Zahl der Provinzen im begonnenen Spiel - genau diese Verwechslung hat den Befund entstehen lassen"

  - id: T-M12-09
    milestone: M12
    title: Die Meldungen erreichen den Spieler
    status: done
    deps: [T-M13-14]
    requirements: [R-UI-14]
    files: [apps/desktop/src/App.tsx, apps/desktop/src/ui/Alerts.tsx]
    tests: [apps/desktop/src/ui/Alerts.test.tsx, apps/desktop/src/App.test.tsx]
    dod: "Ueber zwei vollstaendige Partien bis Tag 171 - Hauptstadtverlust, Ueberrennen, eigenes Ausscheiden, eigene Gefechte mit Verlusten - erschien KEINE einzige Meldung, und der Bereich mit der Klasse .alerts existierte zu keinem Zeitpunkt im DOM. Die Funktion alertsFor ist gebaut und hat gruene Einzeltests; was fehlt, ist die Kette bis zur Sicht - dieselbe Ursache A wie viermal zuvor. Fertig, wenn ein Test aus einer echten Partie heraus prueft, dass bei einem eigenen Ereignis (Kampf in eigener Provinz, Hauptstadtverlust, Rohstoffmangel) eine Meldung im Baum steht - nicht, dass alertsFor die richtige Liste zurueckgibt. Ein Einzeltest der Funktion hat den Befund nicht verhindert und wird ihn nicht verhindern ZUSATZ vom 2026-09-07 aus der Gegenprobe: die Ursache liegt NICHT nur in der Oberflaeche. step.ts ruft dailyTick NACH der ganzen PHASE_ORDER, also nach bookkeeping - und bookkeeping ist die Phase, die ctx.events an draft.eventLog haengt. Alles, was dailyTick erzeugt, landet nie im Protokoll (gemessen ueber drei Spieltage: zurueckgegeben DAY_REPORT dreimal, im eventLog nichts). Das Leck gehoert zuerst behoben, und zwar OHNE Phasenumstellung - die waere eine Aenderung am Golden-Master; eventLog steht in HASH_OMIT_KEYS, ein Nachtragen der in dailyTick entstandenen Ereignisse laesst den Simulationshash unberuehrt. Zwei weitere bestaetigte Funde: die Hauptstadt-Bedingung in Alerts.tsx ist toter Code, weil occupation.ts capitalProvinceId im selben Tick auf null setzt; und die von R-UI-14 geforderte vierte Quelle Fertigstellungen fehlt in alertsFor ganz."

  - id: T-M12-10
    milestone: M12
    title: Die kleineren Befunde des Playtests
    status: done
    deps: [T-M12-04, T-M12-05]
    requirements: [R-UI-05, R-UI-09, R-UI-10, R-ECON-06, R-TIME-03]
    files: [apps/desktop/src/game/actions.ts, apps/desktop/src/ui/icons.tsx, apps/desktop/src/i18n/de.ts, apps/desktop/src/ui/Dialogs.tsx]
    tests: [apps/desktop/src/game/actions.test.ts, apps/desktop/src/ui/IconRow.test.tsx]
    dod: "Sechs Befunde, jeder klein, keiner erfunden. (a) Rueckzug, Marschieren, Angriff und Teilen tragen keinen Tooltip mit Kosten, waehrend die Bauknoepfe es vormachen ('333 Material, 250 Geld - 1 Tag'). (b) Die Spalte Verbrauch der Wirtschaftsuebersicht steht dauerhaft auf 0, weil sie nur den Armeeunterhalt fuehrt - Bau- und Aushebungskosten erscheinen nirgends, und die Frage 'wohin gehen meine Rohstoffe' bleibt offen. (c) Das Vorspulen sagt nie, warum es anhaelt, obwohl R-TIME-03 die Begruendung ausdruecklich verlangt. (d) Flugplatz und Jagdflugzeug teilen dasselbe Symbol (icons.tsx:131 und :143). (e) Der Endedialog schreibt '1 Provinzen' und die Zahl widerspricht dem Satz darueber. (f) Die Debug-Ansicht zeigt einen leeren Zustands-Hash und zwei Ueberschriften ohne Inhalt, womit Playtest-Frage 48 mit ja zu beantworten ist statt mit nein - entweder sie fuellt sich oder sie verschwindet, ein drittes gibt es nicht"

  # --- M19: Die Karte zeigt, was da ist (Playtest-Befund vom 2026-09-07) ---------------
  # Gemeldet als "Ozean ueberlappt Land", gemessen als das Gegenteil: es fehlt. Ein Ausdruck
  # in build-map.mjs behaelt je Provinz den Umriss mit den MEISTEN PUNKTEN statt der groessten
  # Flaeche - 3156 von 3393 Umrissen verworfen, 130 von 237 Provinzen betroffen. Entwurf D21.

  - id: T-M19-01
    milestone: M19
    title: Der Waechter, der es haette finden muessen
    status: done
    deps: []
    requirements: [R-MAP-09]
    design: [D-21]
    files: [packages/mapgen/src/project.ts, data/maps/landmarks.csv, scripts/build-map.mjs, docs/reports/map-geometry.md]
    tests: [packages/mapgen/src/worldmap.geometry.test.ts]
    dod: "Vier Pruefungen gegen world-shapes.json: (G2) je Provinz traegt die gezeichnete Flaeche mindestens 99 Prozent der Quellflaeche; (G1) der Ankerpunkt liegt in einer gezeichneten Flaeche; (G3) bekannte Staedte liegen an Land; (G4) kein Punkt ausserhalb der Leinwand. Sie sind ERWARTET ROT - heute fallen G2 mit 130 von 237, G1 mit 4, G3 mit 10 von 28, G4 mit Groenland - und werden als Uebergang gefuehrt, bis T-M19-02 sie gruen macht: ein neuer roter Waechter blockiert die Abnahmekette nicht (Lehre vom 2026-09-06). Die Zahlen stehen gemessen in docs/reports/map-geometry.md. Die Projektion wird aus build-map.mjs nach packages/mapgen VERSCHOBEN, nicht kopiert - zwei Tabellen der Wahrheit sind genau der Fehler, vor dem die Zeichentests warnen. Schliesst Befund N9 der Auswertung vom 2026-09-05"

  - id: T-M19-02
    milestone: M19
    title: Eine Provinz darf mehrteilig sein
    status: done
    deps: [T-M19-01]
    requirements: [R-MAP-08]
    design: [D-21]
    files: [packages/core/src/state/types.ts, packages/core/src/map/validate.ts, scripts/build-map.mjs, scripts/reproject-map.mjs, packages/mapgen/src/project.ts, apps/desktop/src/map/render.ts, apps/desktop/src/map/MapCanvas.tsx, apps/desktop/src/map/picking.ts, apps/desktop/src/App.tsx, packages/testkit/src/maps.ts, data/maps/world.json, data/maps/testworld.json]
    tests: [packages/mapgen/src/worldmap.geometry.test.ts, apps/desktop/src/map/picking.test.ts]
    dod: "polygon wird von einem Umriss zu einer Liste von Umrissen - nicht die bessere Auswahl, sondern keine Auswahl mehr. Billig ist das, weil polygon reine Zeichendatei ist: der Kern liest es ausserhalb von validateMap nicht, die KI nie, Spielstaende enthalten die Karte nicht - keine Migration, kein Golden Master, kein Schemaschritt. Die vier Pruefungen aus T-M19-01 werden gruen, OHNE dass ihre Schwelle weicher wird; ein Klick auf Alaska und einer auf Kalifornien waehlen dieselbe Provinz. Mindestens 99 Prozent der Landflaeche gezeichnet, pnpm verify gruen, und die Zeichenmessung aus T-M16-06 wiederholt und im Budget (16,7 ms p95) - plus 26 Prozent Punkte sind zu messen, nicht zu schaetzen. ACHTUNG, die naheliegende Reparatur ist ausdruecklich NICHT diese Aufgabe: der groesste Ring waehlt nach der Mercator-Projektion wieder Alaska, weil sie hohe Breiten aufblaeht (Alaska 84453 px2 gegen Weststaaten 58147 px2, bei echter Flaeche aber 268 gegen 329 Grad2)"

  - id: T-M19-03
    milestone: M19
    title: Groenland bleibt auf der Leinwand
    status: done
    deps: [T-M19-02]
    requirements: [R-MAP-08]
    design: [D-21]
    files: [packages/mapgen/src/project.ts, data/maps/world.json]
    tests: [packages/mapgen/src/worldmap.geometry.test.ts]
    dod: "796 Punkte Groenlands liegen oberhalb der Leinwand, bis y = -436; der 78-Grad-Beschnitt wird nie geklippt. Fertig, wenn kein Punkt ausserhalb 0..4000 mal 0..2400 liegt und die Kuestenlinie an der Beschnittkante sichtbar durchgehend bleibt, statt zu einer geraden Linie zusammengefaltet zu werden. Eigene Aufgabe, damit der kleine Fehler nicht in der grossen mitschwimmt und unbemerkt bleibt"

  - id: T-M19-04
    milestone: M19
    title: Suedostaustralien ist ein Punkt
    status: done
    deps: [T-M19-02]
    requirements: [R-MAP-08]
    design: [D-21]
    files: [apps/desktop/src/map/picking.ts, docs/plan/DECISIONS.md, docs/plan/PROBLEME.md]
    tests: [apps/desktop/src/map/picking.test.ts]
    dod: "AUS-SE Suedostaustralien ist eine spielbare Provinz von 39 px2, die ganz innerhalb von AUS-NE liegt - zusammengesetzt aus Australian Capital Territory, Jervis Bay und Macquarie-Insel. Quellendatenfehler, nicht Generatorfehler. Fertig, wenn AUS-SE entweder die Flaeche traegt, die ihr Name behauptet, oder verschwindet und ihre Einheiten an AUS-NE gehen. Ein drittes gibt es nicht: eine Provinz, die man nicht anklicken kann, ist keine. Dazu ein Waechter ueber die Mindestgroesse einer SPIELBAREN Provinz, der seine Schwelle nennt. ACHTUNG, diese Aufgabe ist als einzige in M19 KEINE reine Zeichenaenderung: AUS-SE steht in Australiens Startaufstellung, traegt 52097 Einwohner, zwei Vorkommen und drei Kanten. Sie zu streichen aendert die Wirtschaft einer Macht und den Graphen, also die Partie, also AK-1. Die sichere Richtung ist deshalb, ihr die Flaeche zu GEBEN statt sie zu streichen; wird doch gestrichen, gehoert ein neuer pnpm sim:fullgame dazu und die neue Zahl in den Bericht"

  - id: T-M19-05
    milestone: M19
    title: Der Bericht sagt, was die Karte zeigt
    status: done
    deps: [T-M19-02, T-M19-03, T-M19-04]
    requirements: [R-MAP-09]
    design: [D-21]
    files: [docs/reports/map-geometry.md, docs/plan/PROBLEME.md, docs/plan/PROGRESS.md]
    tests: []
