    dod: "Selbsttaetiger Beschuss erzeugt ein BOMBARDMENT, das ihn als selbsttaetig kennzeichnet; 'Feuer halten' unterdrueckt ihn vollstaendig und ist ueber armyActions erreichbar; bei gleicher sichtbarer Staerke gewinnt die kleinste Provinzkennung, in beiden Reihenfolgen der Armeeliste, und der Seitentausch spiegelt das Ergebnis trefferpunktgenau; marschierende, eingeschiffte und durch cannotAttackUntil gesperrte Armeen feuern nicht; kein Beschuss - von Hand oder selbsttaetig - trifft eine Armee ohne Kriegszustand (Eigenschaftstest ueber zufaellige Dreiparteienlagen); der Schaden einer feuernden Artilleriearmee ist ueber die Einheitenzahl monoton nicht fallend bis 50 und danach konstant; eine KI-Fernwaffenarmee bleibt in Reichweite stehen statt in den Nahkampf zu laufen, und weil T-M14-12 je KI-Macht mindestens eine Armee mit armyRange groesser 0 zusichert, erzeugt im 50-Partien-Turnier aus T-M15-05 jede Schwierigkeitsstufe mindestens ein selbsttaetiges Beschussereignis, Zahl je Stufe mit Status in BALANCING.md; das Feuerleitungsfeld am Army-Objekt ist bereits in T-M15-04 leer angelegt - diese Aufgabe erhoeht SCHEMA_VERSION nicht und aendert persistence/migrate.ts nicht, ein Spielstand ohne das Feld laedt mit bestandener Hashpruefung ueber den einen Schritt 1 nach 2; die Automatik laeuft ueber armyOrder, Determinismus- und Wiedergabetest bleiben gruen"

