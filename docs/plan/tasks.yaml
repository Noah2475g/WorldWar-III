    dod: "captures kommt aus den waehrend des Laufs gesammelten events statt aus dem 500er-Ringpuffer und stimmt bei mehr als 500 Ereignissen mit der Besitzdifferenz ueberein; die Kennzahl economy ist als Endbestand beschriftet; die Startzahlen je Variante steigen von 2 auf mindestens 12, und ein Grundlauf ohne Regelaenderung misst die Rauschgrenze der Zielgroesse - sie steht mit Datum in docs/reports/balance-sweep.md und in docs/plan/BALANCING.md, die Schwelle fuer 'tragend' ist das Doppelte dieser Grenze, und die Spalte Ausschlag in BALANCING.md ist bis zur Neumessung als nicht aussagekraeftig gekennzeichnet; der Weltkarten-Bench misst reine Tickzeit getrennt von der KI-Zeit bei 8 Maechten und mindestens 400 Armeen auf data/maps/world.json und schreibt Median, p99 und den Faktor zu 0,5/2 ms nach docs/reports/worldmap-bench.json; test/balancing.test.ts scheitert, wenn BALANCING.md eine Zahl nennt, die der zitierte Bericht nicht traegt. Der Turniertest behaelt die Untergrenze 0,70 und bekommt hier KEINE Obergrenze: die schwere Stufe gewinnt heute 50:0, eine Obergrenze 0,95 waere sofort rot, machte pnpm test:slow rot und damit AK-1/4/6, T-M12-03 und den Playtest-Haltepunkt unerreichbar - also genau das, was diese Phase aufloesen soll. Stattdessen misst der Lauf die Siegquote und haelt den Ist-Wert mit Datum und Ursache in docs/plan/PROBLEME.md fest, ein it.skip mit Verweis auf T-M15-05 haelt die Zusicherung sichtbar offen, und T-M15-05 stellt die Obergrenze scharf, nachdem die Stufenleiter gebaut ist. Die Spielzahlen in docs/reports/balance-sweep.md und docs/reports/ai-tournament.md werden hier NICHT neu veroeffentlicht, sondern als 'gemessen vor T-M14-06/07' gekennzeichnet - der eine Neulauf beider Berichte steht in T-M14-07, damit die veroeffentlichten Zahlen nicht dreimal ein anderes Spiel beschreiben"

