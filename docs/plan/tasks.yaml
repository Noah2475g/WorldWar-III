    dod: "BESCHLOSSEN am 2026-09-11, kein Haltepunkt mehr. ROHSTOFFE.md D36.3, Anordnung 2 im Entwurfsblatt: vier Bloecke - Versorgung (Nahrung), Baustoffe (Material, Eisen, Kohle), Kriegsstoffe (Oel, Seltene Erden), Geld - mit Trennlinien statt sieben gleichwertiger Zellen. Der Preis steht dabei und wurde mitgekauft: zwei Strichstaerken nebeneinander koennen die Leiste unruhiger machen statt ruhiger; bestaetigt sich das im Spiel, ist es ein Befund fuer den naechsten Playtest und kein Grund, jetzt anders zu bauen. Test zuerst: jede Gruppe traegt ihre Rohstoffe, die Reihenfolge der sieben bleibt unveraendert, und die Gruppentrennung ist im Vorlesetext keine zusaetzliche Ebene."
