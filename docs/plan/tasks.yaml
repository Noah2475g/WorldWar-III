    dod: "ROHSTOFFE.md D36.1. Sieben Eintraege in ICON_PATHS ersetzt (food, wood, iron, coal, oil, rare, money), Strichzeichnung im 24er-Kasten wie der ganze Satz - KEINE Schattenrisse, Rohstoffe haben Zeichen und keine Bilder. Der BESCHLOSSENE Satz aus docs/design/rohstoffleiste.html Abschnitt 1b: Nahrung, Material und Geld aus Fassung 1, Eisen, Kohle, Oel und Seltene Erden aus Fassung 2 (Noahs Wahl, zweite Runde). Nachgemessen bei 14 px, mittlerer Unterschied je Bildpunkt ueber alle 21 Paare: engstes Paar Kohle/Oel 0,127 gegen 0,104 heute und 0,119 bei reiner Fassung 1. Die Messung belegt unterscheidbar, nicht erkennbar - dafuer ist die Sichtpruefung da, besonders bei Seltenen Erden, deren zwei Kristalle zusammenlaufen koennten. Material bekommt einen Balkenstapel statt eines Nadelbaums; der Rohstoff heisst seit T-M23-01 nicht mehr Holz. Haengt an T-M33-01, weil dort der leer gruene Koordinatenwaechter durch eine echte Pfadabfahrt ersetzt wird - neue Pfade ohne ihn waeren ungeprueft eingecheckt. Abnahme ist eine Sichtpruefung der sieben bei 14 px nebeneinander, nicht in Grossaufnahme."
