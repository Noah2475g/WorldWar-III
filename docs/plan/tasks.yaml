    dod: "R-ARCH-06/AK2 - 60 FPS bei 200 Provinzen - misst bis heute niemand, der zeichnet: MapCanvas laeuft in keinem Test, weil getContext in der Testumgebung null liefert, und 141 von 249 Zeilen sind unausgefuehrt. Am gebauten Programm existiert ein Zeichenkontext. Danach ist die Zusicherung erstmals an einem Lauf belegt, der wirklich zeichnet, und die unausgefuehrten Zeilen von MapCanvas sind gezaehlt statt geschaetzt. Faellt die Messung gegen die Anforderung aus, gilt dasselbe wie in T-M16-02: nachmessen und begruenden, nicht die Zahl weichspuelen"

  - id: T-M16-07
