    tests: [apps/desktop/src/storage/TauriStorage.test.ts, test/guards/persistence-contract.test.ts]
    dod: "Der Port tritt als DRITTE Umsetzung zu Memory und IndexedDB und aendert an createStorage und storagePortContract nichts: er erfuellt denselben Vertrag oder er ist falsch. Damit ist die Zusage von T-M8-00 zum ersten Mal ihrem Wortlaut nach erfuellt - dieselbe Vertragstestreihe gegen alle drei Umsetzungen -, die seit M8 dastand und deren Dateien nie existierten; T-M8-00 wird von dieser Aufgabe geschlossen und traegt sie im Feld reopened. Die zweite Pruefung ist die eigentliche (R-PKG-02/AK2): ein ausserhalb des Programms geloeschter Stand verschwindet aus der Liste. Ohne sie waere ein Port gruen, der die Namen nur im Speicher fuehrt und beim Start einmal einliest - genau die Umsetzung, die im Vertrag nicht auffaellt, weil der Vertrag den Prozess nie verlaesst. Der Waechter persistence-contract faellt weiterhin, sobald nur eine Fabrik registriert ist. pnpm verify gruen"

