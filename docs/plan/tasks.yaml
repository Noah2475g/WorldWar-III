    tests: [packages/core/test/perf/worldmap.bench.slow.test.ts, packages/core/test/perf/tick.bench.slow.test.ts]
    dod: "Das Erzeugnis startet, schreibt einen Spielstand, wird geschlossen, wird neu gestartet, und der Stand liegt wieder in der Liste - gemessen und mit Datum in docs/reports/packaging.md festgehalten, nicht behauptet. Erst jetzt zaehlt AK-8 in pnpm acceptance mit; die Zeile aus T-M16-01 wechselt von M16, zaehlt nicht gegen V1 auf ein gemessenes Ergebnis. Die V1-Abnahme AK-1 bis AK-7 bleibt davon unberuehrt: T-M12-03 wird von dieser Aufgabe nicht angefasst"

  - id: T-M16-06
