    dod: "Der DECISIONS.md-Eintrag zu T-M15-06 steht datiert vor der ersten Codeaenderung und wird von test/docs.test.ts geprueft (beide Wege, ihre Kosten - 521 Produktionszeilen unter apps/desktop/src/sim stehen zur Disposition -, das Kriterium, der gewaehlte Weg). Danach: genau ein Aufruf von fastForward des Kerns je Vorspulvorgang, nachgewiesen ueber die Gleichheit von Huellen-Ticks und ticksRun (keine zweite Schleife); fastForwarding={false} existiert nicht mehr und der Abbruchknopf ist in einem Test erreichbar; eine Eroberung zwischen zwei fremden Maechten haelt nicht an, dieselbe mit dem Spieler als Beteiligtem haelt an; BATTLE_STARTED beendet das Ziel 'Gefecht beginnt'; ein zwischen zwei Haeppchen gesetzter Abbruch greift und die Fortschrittszahl waechst mehr als einmal; ein Waechter stellt fest, dass Tempo, Pausenstand und Vorspulziel nicht im GameState liegen (R-ARCH-04/AK2 hat heute keinen); apps/desktop/src/sim hat keinen Eintrag mehr in REACHABILITY_EXCEPTIONS - erreichbar oder geloescht; R-TIME-02/AK3 wird an dem Code geprueft, den der Spieler ausfuehrt; alle fuenf Ziele aus R-TIME-06 sind waehlbar und in docs/ANLEITUNG.md genannt, und in derselben Aufgabe wird entschieden und in 01-REQUIREMENTS.md eingetragen, ob R-TIME-03 auf dieselben fuenf gekuerzt oder R-TIME-06 um 'Angriff auf eigenes Gebiet' auf sechs ergaenzt wird - zwei V1-Anforderungen duerfen nicht mit verschiedenen Zahlen nebeneinander stehen; der Durchsatz steht auf der gespielten Karte gemessen in docs/reports/performance.md gegen die 500 Spielstunden je Sekunde aus R-TIME-02/AK4. Mit dieser Aufgabe ist T-M10-04 geschlossen: das Vorspulen-Menue ist vollstaendig und erreichbar, und die Aufgabe wird in beiden Plandateien wieder auf done gesetzt, mit Verweis auf diese hier"

