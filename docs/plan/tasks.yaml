  - id: T-M16-01
    milestone: M16
    title: AK-8 bekommt einen Ort
    status: done
    deps: [T-M14-01]
    files: [docs/plan/01-REQUIREMENTS.md, scripts/acceptance.mjs, scripts/acceptance-criteria.mjs, docs/plan/PROGRESS.md]
    tests: [test/requirements.test.ts]
    dod: "C-02 sagt seit dem 2026-09-05 eigenes Abnahmekriterium AK-8, und bis zum 2026-09-06 suchte danach kein Skript: Abschnitt 3 kannte AK-1 bis AK-7, acceptance.mjs prueft AK-1 bis AK-5 und AK-7. Danach gilt: 01-REQUIREMENTS.md fuehrt AK-8 in einem eigenen Abschnitt 3.1 mit dem Vermerk, dass es NICHT gegen die V1 zaehlt; pnpm acceptance weist AK-8 als eigene Zeile aus und laesst den Exit-Code unberuehrt, solange M16 nicht gebaut ist - ein AK-8, das gegen V1 zaehlte, waere der Fehler des Nachtrags 2.15 in neuer Gestalt, der AK-2 unerfuellbar gemacht hat. Dazu die Verallgemeinerung, denn der Einzelfall ist nicht das Problem: ein Test findet jedes AK, das der Anforderungstext nennt, und faellt, wenn eines in keiner Abnahmeliste steht - an einer erfundenen Liste nachgewiesen, damit die Pruefung nicht bedeutungslos wird, sobald die echten Kennungen stimmen. pnpm verify gruen, pnpm coverage:requirements meldet weiterhin V1 offen: 0"

  - id: T-M16-02
    milestone: M16
    title: Die oeffentliche Sicht kostet, was sie wert ist
    status: done
    deps: [T-M15-08]
    requirements: [R-AI-04, R-ARCH-06]
    files: [docs/plan/DECISIONS.md, docs/plan/PROBLEME.md, docs/reports/ai-bench.json]
    tests: [packages/core/test/perf/worldmap.bench.slow.test.ts, packages/core/test/perf/tick.bench.slow.test.ts, packages/core/src/view/publicView.test.ts]
    dod: "Zuerst die Messung, dann die Reparatur - in dieser Reihenfolge, sonst ist unbekannt, was die Reparatur bewirkt hat. (a) R-AI-04 wird auf der ausgelieferten Weltkarte mit acht KI-Maechten gemessen, so wie R-ARCH-06/AK1 es seit dem 2026-09-06 wird; die Zusicherung wandert dazu nach worldmap.bench.slow.test.ts, und was in tick.bench.slow.test.ts bleibt, traegt wie der Nachbarblock den Vermerk, dass es die Anforderung NICHT belegt. Der Ausgangswert wird festgehalten, bevor eine Zeile Produktionscode faellt. (b) Zwei Schnitte, jeder einzeln gemessen: visibleProvinces laeuft nicht mehr zweimal je Macht und Tick (heute einmal in updateIntel, einmal in publicView, ueber denselben Zustand im selben Tick), und der unveraenderliche Teil der Provinzsicht - id, name, kind, terrain, coastal, neighbors, seaLinks - wird einmal je Karte gebaut statt je Macht und Tick neu abgeschrieben. publicView.test.ts belegt, dass die Sicht danach dieselbe ist: gleicher Inhalt, gleiche Reihenfolge, und kein Aufrufer kann den geteilten Teil veraendern. (c) ai-bench.json fuehrt aiMedianMs und tickMedianMs einzeln fort, nicht nur den Quotienten - ein gestiegener Anteil kann von beidem kommen. (d) Faellt die Messung gegen die Anforderung aus, wird sie nachgemessen und begruendet wie R-ARCH-06 am 2026-09-06, mit Eintrag in DECISIONS.md und Noahs Entscheidung; das blosse Anheben der Grenze, damit die Zahl passt, ist ausgeschlossen. Nach dieser Aufgabe ist die Zusicherung im Bench nicht mehr lockerer als die Anforderung, die sie vertritt - heute sichert sie 0,5 zu, wo die Anforderung 0,30 sagt. pnpm verify und pnpm test:slow gruen"

